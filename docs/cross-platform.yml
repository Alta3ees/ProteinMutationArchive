name: Cross-platform workspace

on:
  push:
    branches:
      - main
      - 'agent/v0.4-*'
  pull_request:

jobs:
  workspace:
    name: ${{ matrix.os }} / Python 3.11 / Node 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python workspace dependencies
        run: python -m pip install -e ".[web]" pytest

      - name: Test structure-independent workspace
        run: >-
          python -m pytest -q
          tests/test_archive_v035.py
          tests/test_web_actions.py
          tests/test_web_api.py
          tests/test_pymol_launcher.py
          tests/test_workspace_launcher.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
